[project]
name = "sk-stepwise"
version = "0.2.0"
description = "Stepwise hyperparameter search for scikit-learn estimators"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
   "numpy>=2.4.3",
    "optuna>=4.8.0",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
]


[dependency-groups]
dev = [
    "catboost>=1.2",
    "xgboost>=2.1",
    "ipykernel",
    "mypy",
    "pandas-stubs",
    "prek",
    "pytest",
    #"pyre-check>=0.9.22",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = 'tests.*'
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
